<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport"
        content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#155e3f">
  <meta name="application-name" content="Dashboard Etos ID Palu">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Etos ID Palu">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="description" content="Dashboard pembinaan dan pengembangan awardee Etos ID Wilayah Palu.">

  <title>Dashboard Etos ID Palu</title>

  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <link rel="shortcut icon" href="/favicon.svg">
  <link rel="apple-touch-icon" href="/app-icon.svg">
  <link rel="manifest" href="/site.webmanifest">

  <style>
    * { box-sizing: border-box; }
    html, body {
      width: 100%;
      height: 100%;
      min-height: 100%;
      margin: 0;
      padding: 0;
      overflow: hidden;
      background: #f4f7f6;
    }
    #etos-app {
      position: fixed;
      inset: 0;
      z-index: 1;
      display: block;
      width: 100%;
      height: 100%;
      min-width: 100%;
      min-height: 100%;
      margin: 0;
      padding: 0;
      border: 0;
      outline: 0;
      background: #f4f7f6;
      pointer-events: auto;
      touch-action: auto;
    }
  </style>
</head>

<body>
  <iframe
    id="etos-app"
    name="etos-app"
    src="about:blank"
    title="Dashboard Etos ID Palu"
    frameborder="0"
    scrolling="yes"
    loading="eager"
    allow="camera; microphone; geolocation; clipboard-read; clipboard-write; fullscreen"
    allowfullscreen
  ></iframe>

  <script>
    (function () {
      var appBaseUrl =
        'https://script.google.com/macros/s/AKfycby2KnGRMyFCJxL-FaKy4v5z085Bmz1-S1RedUt2jdsX3pcyRsyTuYR1n7P1yjHM90U/exec';
      var iframe = document.getElementById('etos-app');
      var pathMatch = window.location.pathname.match(/^\/r\/([A-Za-z0-9]{6,16})\/?$/);
      var legacyHashMatch = window.location.hash.match(/^#\/refleksi\/([A-Za-z0-9_-]+)$/);

      if (pathMatch) {
        document.title = 'Refleksi & Aksi Kajian — Etos ID Palu';
        iframe.title = 'Refleksi & Aksi Kajian';
        iframe.src = appBaseUrl +
          '?page=refleksi-kajian&code=' + encodeURIComponent(pathMatch[1]);
        return;
      }

      if (legacyHashMatch) {
        document.title = 'Refleksi & Aksi Kajian — Etos ID Palu';
        iframe.title = 'Refleksi & Aksi Kajian';
        iframe.src = appBaseUrl +
          '?page=refleksi-kajian&form=' + encodeURIComponent(legacyHashMatch[1]);
        return;
      }

      iframe.src = appBaseUrl;
    })();
  </script>
</body>
</html>
